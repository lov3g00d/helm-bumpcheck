name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  plugin:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        helm: [v3.19.1, v4.3.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ matrix.helm }}
      - name: build
        run: go build -ldflags "-X main.version=$(sed -n 's/^version:[[:space:]]*//p' plugin.yaml)" -o bin/helm-bumpcheck .
      - name: install and run as a plugin
        run: |
          HELM_PLUGINS="$(mktemp -d)"
          export HELM_PLUGINS
          helm plugin install .
          helm bumpcheck --version
          helm bumpcheck --help
