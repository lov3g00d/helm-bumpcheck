image:
  registry: ghcr.io
  repository: haraldkoch/grafana
  tag: 10.2.0
extraInitContainers:
  - name: 01-init-db
    image: ghcr.io/haraldkoch/postgres-init:15.4@sha256:3cf3da8b51b6804493f2adbc1f8d49fee9764c5159b84014a4c0618da094ebe2
    envFrom:
      - secretRef:
          name: grafana-secret
replicas: 2
env:
  GF_AUTH_GENERIC_OAUTH_API_URL: https://auth.${CLUSTER_DOMAIN}/api/oidc/userinfo
  GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://auth.${CLUSTER_DOMAIN}/api/oidc/authorization
  GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
  GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://auth.${CLUSTER_DOMAIN}/api/oidc/token
  GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: contains(groups[*], 'grafana-admins')
    && 'Admin' || 'Viewer'
  GF_DATE_FORMATS_USE_BROWSER_LOCALE: true
  GF_EXPLORE_ENABLED: true
  GF_FEATURE_TOGGLES_ENABLE: publicDashboards
  GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: natel-discrete-panel,pr0ps-trackmap-panel,panodata-map-panel
  GF_SECURITY_COOKIE_SAMESITE: grafana
  GF_SERVER_ROOT_URL: https://grafana.${CLUSTER_DOMAIN}
envFromSecrets:
  - name: grafana-secret
grafana.ini:
  analytics:
    check_for_updates: false
    check_for_plugin_updates: false
    reporting_enabled: false
  auth:
    oauth_auto_login: true
    oauth_allow_insecure_email_lookup: true
  auth.generic_oauth:
    enabled: true
    name: Authelia
    icon: signin
    scopes: openid profile email groups
    empty_scopes: false
    login_attribute_path: preferred_username
    groups_attribute_path: groups
    name_attribute_path: name
    use_pkce: true
  auth.generic_oauth.group_mapping:
    org_id: 1
    role_attribute_path: 'contains(groups[*], ''admins'') && ''Admin'' || contains(groups[*],
      ''people'') && ''Viewer''

      '
  auth.basic:
    enabled: false
  auth.anonymous:
    enabled: true
    org_name: HomeOps
    org_id: 1
    org_role: Viewer
  news:
    news_feed_enabled: false
defaultDashboardsTimezone: ${TIMEZONE}
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default
      - name: applications
        orgId: 1
        folder: Applications
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/applications
      - name: home
        orgId: 1
        folder: Home
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/home
      - name: infrastructure
        orgId: 1
        folder: Infrastructure
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/infrastructure
datasources:
  datasources.yaml:
    apiVersion: 1
    deleteDatasources:
      - name: Alertmanager
        orgId: 1
      - name: Loki
        orgId: 1
      - name: Prometheus
        orgId: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://thanos-query-frontend.monitoring.svc.cluster.local:9090
        jsonData:
          prometheusType: Thanos
        isDefault: true
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki-gateway.monitoring.svc.cluster.local
        jsonData:
          maxLines: 250
      - name: Alertmanager
        type: alertmanager
        uid: alertmanager
        access: proxy
        url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
        jsonData:
          implementation: prometheus
dashboards:
  applications:
    miniflux:
      url: https://raw.githubusercontent.com/miniflux/v2/main/contrib/grafana/dashboard.json
      datasource: Prometheus
  home:
    zfs:
      gnetId: 7845
      revision: 4
      datasource: Prometheus
  infrastructure:
    cert-manager:
      url: https://raw.githubusercontent.com/monitoring-mixins/website/master/assets/cert-manager/dashboards/cert-manager.json
      datasource: Prometheus
    cloudflared:
      gnetId: 17457
      revision: 6
      datasource:
        - name: DS_PROMETHEUS
          value: Prometheus
    external-dns:
      gnetId: 15038
      revision: 1
      datasource: Prometheus
    minio:
      gnetId: 13502
      revision: 23
      datasource:
        - name: DS_PROMETHEUS
          value: Prometheus
    node-exporter-full:
      gnetId: 1860
      revision: 31
      datasource: Prometheus
    redis:
      gnetId: 763
      revision: 5
      datasource: Prometheus
    ceph-cluster:
      gnetId: 2842
      revision: 17
      datasource: Prometheus
    ceph-osd:
      gnetId: 5336
      revision: 9
      datasource: Prometheus
    ceph-pools:
      gnetId: 5342
      revision: 9
      datasource: Prometheus
    external-secrets:
      url: https://raw.githubusercontent.com/external-secrets/external-secrets/main/docs/snippets/dashboard.json
      datasource: Prometheus
    flux-cluster:
      url: https://raw.githubusercontent.com/fluxcd/flux2/main/manifests/monitoring/monitoring-config/dashboards/cluster.json
      datasource: Prometheus
    flux-control-plane:
      url: https://raw.githubusercontent.com/fluxcd/flux2/main/manifests/monitoring/monitoring-config/dashboards/control-plane.json
      datasource: Prometheus
    flux-logs:
      url: https://raw.githubusercontent.com/fluxcd/flux2/main/manifests/monitoring/monitoring-config/dashboards/logs.json
      datasource: Prometheus
  default:
    kubernetes-api-server:
      url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-system-api-server.json
      datasource: Prometheus
    kubernetes-coredns:
      url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-system-coredns.json
      datasource: Prometheus
    kubernetes-global:
      url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-global.json
      datasource: Prometheus
    kubernetes-namespaces:
      url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-namespaces.json
      datasource: Prometheus
    kubernetes-nodes:
      url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-nodes.json
      datasource: Prometheus
    kubernetes-pods:
      url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-pods.json
      datasource: Prometheus
sidecar:
  dashboards:
    enabled: true
    searchNamespace: ALL
    folderAnnotation: grafana_folder
    provider:
      foldersFromFilesStructure: true
  datasources:
    enabled: true
    searchNamespace: ALL
  resources:
    requests:
      cpu: 15m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
plugins:
  - grafana-clock-panel
  - grafana-piechart-panel
  - grafana-worldmap-panel
  - natel-discrete-panel
  - pr0ps-trackmap-panel
  - vonage-status-panel
serviceMonitor:
  enabled: true
service:
  ipFamilyPolicy: PreferDualStack
ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    hajimari.io/appName: grafana
    hajimari.io/icon: simple-icons:grafana
  hosts:
    - grafana.${CLUSTER_DOMAIN}
  tls:
    - hosts:
        - grafana.${CLUSTER_DOMAIN}
imageRenderer:
  enabled: true
  replicas: 2
  networkPolicy:
    limitIngress: false
  serviceMonitor:
    enabled: true
persistence:
  enabled: false
testFramework:
  enabled: false
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: grafana
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
