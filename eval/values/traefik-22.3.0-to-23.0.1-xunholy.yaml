deployment:
  enabled: true
  replicas: 1
service:
  spec:
    loadBalancerIP: ${CLUSTER_LB_TRAEFIK_GATEWAY}
    externalTrafficPolicy: Local
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
logs:
  general:
    format: json
    level: INFO
  access:
    enabled: true
    format: json
ingressClass:
  enabled: true
  isDefaultClass: false
  fallbackApiVersion: v1
tlsOptions:
  default:
    minVersion: VersionTLS12
    maxVersion: VersionTLS13
    sniStrict: true
pilot:
  enabled: false
experimental:
  plugins:
    enabled: true
providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
    allowExternalNameServices: true
resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 512Mi
