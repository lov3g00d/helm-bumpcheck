  - name: traefik-22.3.0-to-23.0.1-xunholy
    split: holdout
    source: xunholy/k8s-gitops@5919ea988
    chart: {repo: https://traefik.github.io/charts, name: traefik}
    appRepo: traefik/traefik-helm-chart
    tagPrefix: "v"
    from: "22.3.0"
    to: "23.0.1"
    valuesFile: values/traefik-22.3.0-to-23.0.1-xunholy.yaml
    affected: []
    traps:
      - release: v23.0.0
        entry: "BREAKING CHANGE: Traefik 2.10 comes with CRDs update on API Group"
        keys:
          - "providers.kubernetesCRD.enabled"
          - "providers.kubernetesCRD.allowCrossNamespace"
          - "providers.kubernetesCRD.allowExternalNameServices"
          - "ingressClass.fallbackApiVersion"
        why: the CRDs need updating by hand, the values keep working
