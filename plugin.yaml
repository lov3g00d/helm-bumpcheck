name: bumpcheck
version: 0.1.0
usage: Check a chart version bump against the values you set
description: Diff chart defaults across a version bump against your values files and match the app release notes to the keys you set
ignoreFlags: false
platformCommand:
  - command: ${HELM_PLUGIN_DIR}/bin/helm-bumpcheck
platformHooks:
  install:
    - command: ${HELM_PLUGIN_DIR}/scripts/install-binary.sh
  update:
    - command: ${HELM_PLUGIN_DIR}/scripts/install-binary.sh
